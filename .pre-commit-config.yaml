repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Both generated trees are buf output: leave them exactly as emitted.
      - id: trailing-whitespace
        exclude: ^(gen/|web/app/src/gen/)
      - id: end-of-file-fixer
        exclude: ^(gen/|web/app/src/gen/)
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: gofmt -l -w
        language: system
        types: [go]
        exclude: ^gen/
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        types: [go]
        pass_filenames: false
      - id: go-build
        name: go build
        entry: go build ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: web-typecheck
        name: tsc --noEmit
        entry: pnpm --dir web/app typecheck
        language: system
        files: ^web/app/.*\.(ts|tsx|json)$
        exclude: ^web/app/src/gen/
        pass_filenames: false
      - id: web-lint
        name: oxlint
        entry: pnpm --dir web/app lint
        language: system
        files: ^web/app/.*\.(ts|tsx)$
        exclude: ^web/app/src/gen/
        pass_filenames: false

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/bufbuild/buf
    rev: v1.50.0
    hooks:
      - id: buf-lint
      - id: buf-format
      # Enable after the first release tag exists:
      # - id: buf-breaking
      #   args: [--against, ".git#tag=v0.1.0"]
