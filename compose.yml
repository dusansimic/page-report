services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Public base URL. Everything is served from this one origin.
      PR_BASE_URL: ${PR_BASE_URL:?e.g. https://reports.example.com}
      PR_DB_PATH: /data/page-report.db
      # >= 32 random bytes, e.g. `openssl rand -hex 32`.
      PR_SESSION_SECRET: ${PR_SESSION_SECRET:?set a 32+ byte secret}
      # "github" or "oidc". Used for human web login only; CLI tokens are
      # minted by this server.
      PR_PROVIDER: ${PR_PROVIDER:-github}
      # Comma-separated identities allowed to log in / upload.
      PR_ALLOWLIST: ${PR_ALLOWLIST:?comma-separated allowlist}
      # Provider credentials (set the ones matching PR_PROVIDER).
      PR_GITHUB_CLIENT_ID: ${PR_GITHUB_CLIENT_ID:-}
      PR_GITHUB_CLIENT_SECRET: ${PR_GITHUB_CLIENT_SECRET:-}
      PR_OIDC_ISSUER: ${PR_OIDC_ISSUER:-}
      PR_OIDC_CLIENT_ID: ${PR_OIDC_CLIENT_ID:-}
      PR_OIDC_CLIENT_SECRET: ${PR_OIDC_CLIENT_SECRET:-}
    volumes:
      - data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Bare hostname for the Caddy site block (no scheme).
      BASE_DOMAIN: ${BASE_DOMAIN:?e.g. reports.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  data:
  caddy_data:
  caddy_config:
