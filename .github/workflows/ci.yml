# Every commit: verify, then build both artifacts. No side effects outside the
# run — no registry push, no release, no contents: write.
#
# There are deliberately no path filters. They would be evaluated for tag
# pushes too (where there is no meaningful diff), and a skipped job never
# reports a status, which breaks required checks on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: ./.github/workflows/_verify.yml
    permissions:
      contents: read

  meta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: v
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

  cli:
    needs: [verify, meta]
    uses: ./.github/workflows/_build-cli.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.meta.outputs.version }}
      retention-days: 7

  image:
    needs: [verify, meta]
    uses: ./.github/workflows/_build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.meta.outputs.version }}
      push: false
