<!doctype html>
<!--
  CSP-safe starting point for a page-report upload.

  Served under:
    default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline';
    script-src 'self' 'unsafe-inline'; frame-ancestors 'none'

  So: inline <style>/<script> only, images as data: URIs or inline SVG, no CDN
  fonts/CSS/JS, no cross-origin fetch. Keep the file under 5 MiB.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report title</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #5c5f66; --border: #e3e5e8;
    --accent: #2563eb; --code-bg: #f4f5f7; --card-bg: #fafbfc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d; --fg: #e6e8eb; --muted: #9aa0a8; --border: #2c2f36;
      --accent: #60a5fa; --code-bg: #22252c; --card-bg: #1c1f25;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  h1 { font-size: 1.7rem; line-height: 1.25; margin: 0 0 .4rem; }
  .subtitle { color: var(--muted); margin: 0 0 2rem; }
  h2 { font-size: 1.2rem; margin: 2.2rem 0 .7rem; padding-top: 1.2rem; border-top: 1px solid var(--border); }
  code {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 4px;
    padding: .1em .35em; font-size: .875em;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  pre {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: .9rem 1rem; overflow-x: auto;
  }
  pre code { background: none; border: none; padding: 0; }
  table { border-collapse: collapse; width: 100%; margin: .8rem 0; font-size: .95rem; }
  th, td { text-align: left; padding: .45rem .7rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .card {
    background: var(--card-bg); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: .9rem 1.1rem; margin: 1rem 0;
  }
  ul, ol { padding-left: 1.4rem; }
  li { margin: .3rem 0; }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Report title</h1>
  <p class="subtitle">One-line summary · YYYY-MM-DD</p>

  <div class="card">
    <strong>Key finding.</strong> Lead with the conclusion the reader needs.
  </div>

  <h2>Section</h2>
  <p>Body text. Inline <code>code</code> and blocks:</p>
  <pre><code>page-report upload report.html --title "Report title"</code></pre>

  <h2>Data</h2>
  <table>
    <tr><th>Item</th><th>Value</th></tr>
    <tr><td>Example</td><td>42</td></tr>
  </table>

  <p class="muted">Generated by an agent · page-report</p>
</main>
</body>
</html>
