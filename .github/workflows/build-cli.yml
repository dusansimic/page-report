name: Build CLI

on:
  # No paths filter here on purpose: path filters are evaluated for tag pushes
  # too, where there is no meaningful file diff, which would skip releases.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - cmd/page-report/**
      - internal/client/**
      - internal/config/**
      - internal/auth/**
      - gen/**
      - go.mod
      - go.sum
      - .github/workflows/build-cli.yml
  workflow_dispatch:

concurrency:
  group: build-cli-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="$(git describe --tags --always --dirty)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -trimpath \
            -ldflags="-s -w \
              -X main.version=${{ steps.meta.outputs.version }} \
              -X main.commit=${{ github.sha }} \
              -X main.date=${{ steps.meta.outputs.date }}" \
            -o dist/page-report ./cmd/page-report
          ./dist/page-report version

      - uses: actions/upload-artifact@v7
        with:
          name: page-report-linux-amd64
          path: dist/page-report
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: page-report-linux-amd64
          path: dist

      - name: Package
        run: |
          chmod +x dist/page-report
          cp README.md LICENSE dist/
          tar -czf "page-report_${{ github.ref_name }}_linux_amd64.tar.gz" \
            -C dist page-report README.md LICENSE
          sha256sum page-report_*.tar.gz > checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            page-report_*.tar.gz
            checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
