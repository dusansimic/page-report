syntax = "proto3";

package pagereport.v1;

option go_package = "github.com/dusan/page-report/gen/pagereport/v1;pagereportv1";

// PageService is the CLI-facing API for uploading and managing report pages.
// All RPCs except GetServerInfo require a bearer token minted by this server
// (see DashboardService.CreateToken).
//
// This service is deliberately unreachable from a browser: the server refuses
// any request carrying a script-initiated Sec-Fetch-Dest. The web dashboard
// uses DashboardService instead.
service PageService {
  // GetServerInfo returns public server metadata. Unauthenticated; the CLI
  // calls it during `login` to tell the user where to mint a token.
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse) {}
  // WhoAmI reports the identity behind the presented token. The CLI calls it
  // to verify a pasted token before storing it.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse) {}
  rpc UploadPage(UploadPageRequest) returns (UploadPageResponse) {}
  rpc ListPages(ListPagesRequest) returns (ListPagesResponse) {}
  rpc GetPage(GetPageRequest) returns (GetPageResponse) {}
  rpc DeletePage(DeletePageRequest) returns (DeletePageResponse) {}
  rpc PrunePages(PrunePagesRequest) returns (PrunePagesResponse) {}
}

message GetServerInfoRequest {}

message GetServerInfoResponse {
  // Public base URL of the server: SPA, API and report pages all live here.
  string base_url = 1;
  // Dashboard page where a user mints CLI tokens.
  string tokens_url = 2;
  string server_version = 3;
}

message WhoAmIRequest {}

message WhoAmIResponse {
  string subject = 1;
  string email = 2;
  string login = 3;
  // Id and label of the token used for this call.
  string token_id = 4;
  string token_name = 5;
}

message PageMeta {
  string id = 1;
  string title = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  // Unix seconds UTC.
  int64 created_at = 5;
  string created_by = 6;
  // Full URL where the page is served.
  string url = 7;
}

message UploadPageRequest {
  // Raw HTML bytes (base64 in JSON encoding).
  bytes content = 1;
  string title = 2;
  // Only "text/html" and "text/plain" are accepted; parameters are ignored
  // and the value is stored canonicalised with charset=utf-8. Anything else is
  // rejected with INVALID_ARGUMENT. Defaults to "text/html; charset=utf-8".
  string content_type = 3;
}

message UploadPageResponse {
  string id = 1;
  string url = 2;
}

message ListPagesRequest {}

message ListPagesResponse {
  repeated PageMeta pages = 1;
}

message GetPageRequest {
  string id = 1;
  // When true, the response includes the stored HTML content.
  bool include_content = 2;
}

message GetPageResponse {
  PageMeta meta = 1;
  bytes content = 2;
}

message DeletePageRequest {
  string id = 1;
}

message DeletePageResponse {}

message PrunePagesRequest {
  // Delete pages created earlier than this many seconds ago.
  int64 older_than_seconds = 1;
}

message PrunePagesResponse {
  int64 deleted_count = 1;
}
