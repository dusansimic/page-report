# Reusable server-image builder. Each architecture builds on its own native
# runner (no QEMU emulation) and, when publishing, pushes an untagged
# by-digest blob; the merge job then stitches the digests into one manifest
# list carrying all the tags.
#
# With push: false the build still runs, so a broken Dockerfile fails a PR,
# but nothing leaves the runner and the merge job is skipped.
name: _build-image

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        description: "'release' (semver + latest) or 'main' (moving main tag)"
        required: true
        type: string
      push:
        required: false
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            slug: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            slug: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: date
        run: echo "iso=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      # Labels only; the merge job owns the tags.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.date.outputs.iso }}
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug }}
          outputs: ${{ inputs.push && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}

      - name: Export digest
        if: inputs.push
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ steps.build.outputs.digest }}"

      - uses: actions/upload-artifact@v7
        if: inputs.push
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: inputs.push
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags come from inputs.channel + inputs.version, never from github.ref:
      # on a workflow_dispatch re-release github.ref is a branch, so anything
      # reading the ref (docker/metadata-action's type=semver) would silently
      # produce no version tag at all.
      #
      # The channel is what decides which tags may move. Only `release` can
      # write `latest`; `main` publishes moving/commit tags and nothing else.
      - id: tags
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -eu
          args="-t ${IMAGE}:sha-${{ github.sha }}"
          case "$CHANNEL" in
            main)
              # Tip of main. Deliberately no version-shaped tag: VERSION here
              # is a `git describe` string, not a release.
              args="$args -t ${IMAGE}:main"
              ;;
            release)
              case "$VERSION" in
                v[0-9]*.[0-9]*.[0-9]*) ;;
                *) echo "::error::channel=release needs a vX.Y.Z version, got '$VERSION'"; exit 1 ;;
              esac
              args="$args -t ${IMAGE}:${VERSION}"
              # A prerelease gets its exact version and nothing else: the
              # floating tags must only ever resolve to a stable release, or
              # someone pinned to `0.1` would be handed an RC. No bare-major
              # tag while the project is v0.x, since "0" is not a useful
              # compatibility promise.
              case "$VERSION" in
                *-*) ;;
                *)
                  minor="${VERSION#v}"      # v0.1.0 -> 0.1.0
                  args="$args -t ${IMAGE}:${minor%.*} -t ${IMAGE}:latest"
                  ;;
              esac
              ;;
            *) echo "::error::unknown channel '$CHANNEL'"; exit 1 ;;
          esac
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "will tag:$args"

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          set -eu
          # shellcheck disable=SC2046,SC2086  # word splitting is the point here
          docker buildx imagetools create ${{ steps.tags.outputs.args }} \
            $(printf "${IMAGE}@%s " *)

      # The sha tag is the one tag every channel publishes.
      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:sha-${{ github.sha }}"
