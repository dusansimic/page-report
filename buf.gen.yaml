version: v2
# Plugins run through `go tool` so their versions are pinned by the `tool`
# directives in go.mod: a fresh clone needs only Go and buf, and CI can assert
# that gen/ matches the proto.
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen
    opt: paths=source_relative
  # TypeScript for the embedded SPA. connect-es v2 builds its clients from the
  # protobuf-es output alone, so no separate connect plugin is needed.
  - remote: buf.build/bufbuild/es:v2.13.0
    out: web/app/src/gen
    opt: target=ts
