name: Build CLI

on:
  # No paths filter here on purpose: path filters are evaluated for tag pushes
  # too, where there is no meaningful file diff, which would skip releases.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - cmd/page-report/**
      - internal/client/**
      - internal/config/**
      - internal/auth/**
      - gen/**
      - go.mod
      - go.sum
      - .github/workflows/build-cli.yml
  workflow_dispatch:

concurrency:
  group: build-cli-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="$(git describe --tags --always --dirty)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags="-s -w \
              -X main.version=${{ steps.meta.outputs.version }} \
              -X main.commit=${{ github.sha }} \
              -X main.date=${{ steps.meta.outputs.date }}" \
            -o dist/page-report ./cmd/page-report

      # Only the native build can be executed on the runner.
      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./dist/page-report version

      - uses: actions/upload-artifact@v7
        with:
          name: page-report-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/page-report
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: page-report-*
          path: artifacts

      # One tarball per platform, named the way install.sh and
      # `page-report update` expect: page-report_<tag>_<os>_<arch>.tar.gz.
      - name: Package
        run: |
          set -eu
          for dir in artifacts/page-report-*; do
            platform="${dir#artifacts/page-report-}"
            os="${platform%-*}"
            arch="${platform##*-}"
            mkdir -p "pkg/$platform"
            cp "$dir/page-report" README.md LICENSE "pkg/$platform/"
            chmod +x "pkg/$platform/page-report"
            tar -czf "page-report_${{ github.ref_name }}_${os}_${arch}.tar.gz" \
              -C "pkg/$platform" page-report README.md LICENSE
          done
          sha256sum page-report_*.tar.gz > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            page-report_*.tar.gz
            checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
